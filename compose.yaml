services:
  springboot-monitor:
    image: bellsoft/liberica-openjre-debian:25
    container_name: springboot-monitor
    restart: unless-stopped
    working_dir: /
    command: ["java", "-jar", "spring-project-monitor.jar"]
    volumes:
      - ./target/spring-project-monitor.jar:/spring-project-monitor.jar:ro
      - ./data:/data:ro
    environment:
      - TZ=Europe/Berlin
    ports:
      - "9999:9999"

